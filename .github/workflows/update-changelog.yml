name: Release on merge to main

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Bump version, update changelog, tag
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version
        env:
          # Highest label wins if several are present.
          BUMP: ${{ contains(github.event.pull_request.labels.*.name, 'major') && 'major' || contains(github.event.pull_request.labels.*.name, 'minor') && 'minor' || contains(github.event.pull_request.labels.*.name, 'patch') && 'patch' || '' }}
        run: |
          if [ -z "$BUMP" ]; then
            echo "::error::Merged PR has no 'major', 'minor' or 'patch' label"
            exit 1
          fi
          npm version "$BUMP" --no-git-tag-version
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "BUMP=$BUMP" >> "$GITHUB_ENV"

      - name: Update CHANGELOG.md
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          [ -f CHANGELOG.md ] || printf '# Changelog\n\n' > CHANGELOG.md
          entry=$(printf '## v%s (%s)\n\n### Pull Requests\n[#%s](%s) | %s\n' "$VERSION" "$(date -u +%Y-%m-%d)" "$PR_NUMBER" "$PR_URL" "$PR_TITLE")
          # Keep the "# Changelog" heading (first two lines) on top; newest entry goes right below it.
          { head -n 2 CHANGELOG.md; printf '%s\n\n\n' "$entry"; tail -n +3 CHANGELOG.md; } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore(release): v${VERSION} (${BUMP})"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push --atomic origin HEAD:main "v${VERSION}"
