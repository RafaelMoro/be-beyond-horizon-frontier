name: Check release label

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, reopened]

permissions:
  contents: read

jobs:
  check_label:
    name: Require major, minor or patch label
    runs-on: ubuntu-latest
    steps:
      - name: Check labels
        env:
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'major') || contains(github.event.pull_request.labels.*.name, 'minor') || contains(github.event.pull_request.labels.*.name, 'patch') }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ', ') }}
        run: |
          echo "Labels: $LABELS"
          if [ "$HAS_LABEL" != "true" ]; then
            echo "::error::Missing label 'major', 'minor' or 'patch' on the pull request"
            exit 1
          fi
