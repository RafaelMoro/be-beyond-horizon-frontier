# beta / production env, resolved at deploy time from SSM under /beyond-horizon-frontier/<stage>/.
# SecureString: MONGO_PWD, JWT_KEY, ONE_TIME_JWT_KEY, RESEND_API_KEY. The rest are String. No values in the repo.
# A missing parameter fails the deploy (fail closed).
NODE_ENV: production
MONGO_CONNECTION: ${ssm:/beyond-horizon-frontier/${sls:stage}/MONGO_CONNECTION}
MONGO_USER: ${ssm:/beyond-horizon-frontier/${sls:stage}/MONGO_USER}
MONGO_PWD: ${ssm:/beyond-horizon-frontier/${sls:stage}/MONGO_PWD}
MONGO_HOST: ${ssm:/beyond-horizon-frontier/${sls:stage}/MONGO_HOST}
MONGO_DB_NAME: ${ssm:/beyond-horizon-frontier/${sls:stage}/MONGO_DB_NAME}
FRONTEND_URI: ${ssm:/beyond-horizon-frontier/${sls:stage}/FRONTEND_URI}
TEST_FRONTEND_URI: ${ssm:/beyond-horizon-frontier/${sls:stage}/TEST_FRONTEND_URI}
DOMAIN_URI: ${ssm:/beyond-horizon-frontier/${sls:stage}/DOMAIN_URI}
JWT_KEY: ${ssm:/beyond-horizon-frontier/${sls:stage}/JWT_KEY}
ONE_TIME_JWT_KEY: ${ssm:/beyond-horizon-frontier/${sls:stage}/ONE_TIME_JWT_KEY}
RESEND_API_KEY: ${ssm:/beyond-horizon-frontier/${sls:stage}/RESEND_API_KEY}
MAILER_MAIL: ${ssm:/beyond-horizon-frontier/${sls:stage}/MAILER_MAIL}
