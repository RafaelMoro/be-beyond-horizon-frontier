# `--stage local` only (serverless-offline / osls print). Never deployed; dummy values only.
# Every key the schema reads is set, so a developer's .env (prod) can't decide anything: process env wins over .env
# and MONGO_URI wins over the MONGO_* parts. NODE_ENV=test arms the localhost-only Mongo guard.
MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
MONGO_DB_NAME: budget-master-offline
FRONTEND_URI: http://localhost:4100
TEST_FRONTEND_URI: http://localhost:4101
DOMAIN_URI: http://localhost:4102
NODE_ENV: test
JWT_KEY: offline-jwt-key
ONE_TIME_JWT_KEY: offline-one-time-key
RESEND_API_KEY: ''
MAILER_MAIL: ''
